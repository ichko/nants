<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!-- the same winding trails the red bands carry, in ink on cream, still and
       faint. every curve is one period across the tile, so it repeats clean. -->
  <g fill="none" stroke="#241d19" stroke-opacity="0.07" stroke-width="1.4"
     stroke-linecap="round" stroke-dasharray="5 9">
    <path d="M0 40 C 40 16, 80 64, 120 40 S 200 64, 240 40"/>
    <path d="M0 120 C 40 92, 80 148, 120 120 S 200 148, 240 120"/>
    <path d="M0 200 C 40 178, 80 222, 120 200 S 200 222, 240 200"/>
    <path d="M60 0 C 36 40, 84 80, 60 120 S 84 200, 60 240"/>
    <path d="M180 0 C 204 40, 156 80, 180 120 S 156 200, 180 240"/>
  </g>
</svg>
