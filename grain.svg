<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">
  <!-- plain grey pixel noise, sat behind the trails so the red is not flat.
       the alpha is forced opaque, otherwise turbulence makes a haze rather
       than pixels; strength is the rect opacity alone. -->
  <filter id="g" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1"
                  stitchTiles="stitch" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#g)" opacity="0.8"/>
</svg>
