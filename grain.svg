<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">
  <!-- plain grey pixel noise, sat behind the trails so the red is not flat -->
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1"
                  stitchTiles="stitch" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#g)" opacity="0.07"/>
</svg>
